name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and publish, e.g. v0.1.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Check the version and release notes
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/releases/${TAG}.md"
      - run: npm ci --ignore-scripts
      - name: Build the Linux app
        run: npm run desktop:build:local
      - name: Package
        run: |
          app=$(ls -d test-results/desktop-build-*/packaged/ai-video-editor-linux-x64)
          mkdir -p release
          tar -C "$(dirname "$app")" -czf release/ai-video-editor-linux-x64.tar.gz ai-video-editor-linux-x64
          (cd release && sha256sum ai-video-editor-linux-x64.tar.gz > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag push already has the tag; an on-demand run creates it here.
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "AI Video Editor ${TAG#v}" \
            --notes-file "docs/releases/${TAG}.md" \
            --prerelease
